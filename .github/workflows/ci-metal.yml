name: ci-metal

# Tier 2 from specs/010-conformance.md section 4: the job that promises a
# backend. FORMA_REQUIRE_METAL turns "no device on this runner" from a skip into
# the failure it should be where Metal is promised -- without it, this job
# would rot green.
#
# The plain test on macOS runs through test.os in .lateregate.yaml. It cannot
# set FORMA_REQUIRE_METAL or run the race detector, so this job is the one
# that does both on a machine with Metal.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  FORMA_REQUIRE_METAL: '1'

jobs:
  metal:
    name: metal
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        check-latest: true

    - name: Test under the race detector
      env:
        CGO_ENABLED: '1'
      run: go test -race -timeout 45m ./...
